spring:
  datasource:
    hikari:
      maximum-pool-size: 20
  flyway:
    clean-disabled: false

app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars-long-for-hmac256
    issuer: factoryflow-test
    audience: factoryflow-api-test
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins:
      - http://localhost:4200

logging:
  level:
    fpt.qn.mes: WARN
    org.springframework.security: WARN
    org.jooq: WARN
    org.testcontainers: WARN
    com.zaxxer.hikari: WARN

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
