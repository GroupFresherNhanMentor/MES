---
spring:
  application:
    name: project-management-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    shutdown:
      access: none
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-at-least-32-chars}
    issuer: ${JWT_ISSUER:factoryflow}
    audience: ${JWT_AUDIENCE:factoryflow-api}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}     # 15 minutes
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    fpt.qn.mes: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
