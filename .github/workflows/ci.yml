name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # jOOQ codegen introspects the live schema, so Flyway must run first.
      # Tests use Testcontainers (their own isolated PostgreSQL), not this service.
      - name: Apply Flyway migrations for jOOQ codegen
        working-directory: be
        run: |
          ./mvnw flyway:migrate \
            -Ddb.url=jdbc:postgresql://localhost:5432/mes \
            -Ddb.username=postgres \
            -Ddb.password=postgres \
            --no-transfer-progress

      - name: Build, generate sources & run tests
        working-directory: be
        run: |
          ./mvnw verify \
            -Ddb.url=jdbc:postgresql://localhost:5432/mes \
            -Ddb.username=postgres \
            -Ddb.password=postgres \
            --no-transfer-progress
        env:
          # Testcontainers needs Docker — available by default on ubuntu-latest
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: be/target/surefire-reports/
          retention-days: 7
