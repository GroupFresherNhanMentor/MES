<div class="page-header">
  <h1 class="page-heading">Locations</h1>
  <p class="page-subtitle">Warehouse: {{ warehouseId() }}</p>
</div>
<mat-card>
  <mat-card-header>
    <mat-card-title>Location Management</mat-card-title>
    <div class="toolbar">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="keyword" (keyup.enter)="search()" placeholder="code or name">
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filterStatus" (selectionChange)="search()">
          <mat-option value="">All</mat-option>
          @for (s of statuses; track s) {
            <mat-option [value]="s">{{ s }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="items()" class="full-width">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let l">{{ l.code }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let l">{{ l.name }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let l">
          <span class="ff-badge"
            [class.ff-badge--active]="l.locationStatusName === 'AVAILABLE'"
            [class.ff-badge--onhold]="l.locationStatusName === 'MAINTENANCE'"
            [class.ff-badge--cancelled]="l.locationStatusName === 'INACTIVE' || l.locationStatusName === 'OCCUPIED'">
            {{ l.locationStatusName }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let l">
          <button mat-icon-button (click)="deactivate(l)" [disabled]="!isActive(l.locationStatusName)">
            <mat-icon>block</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="total()" [pageSize]="size()" [pageIndex]="page()"
      (page)="onPage($event)" [pageSizeOptions]="[10,20,50]"></mat-paginator>
  </mat-card-content>
</mat-card>
