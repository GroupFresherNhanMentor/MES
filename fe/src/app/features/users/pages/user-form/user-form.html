<h2 mat-dialog-title>{{ data ? 'Edit' : 'Add' }} User</h2>

<mat-dialog-content>
  <div style="display:flex; flex-direction:column; gap:12px; padding-top:8px;">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input
        matInput
        [(ngModel)]="username"
        name="username"
        required
        minlength="3"
        maxlength="100"
        autocomplete="username"
        [disabled]="!!data"
      />
    </mat-form-field>

    @if (!data) {
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="8"
          maxlength="255"
          autocomplete="new-password"
        />
      </mat-form-field>
    }

    <mat-form-field appearance="outline">
      <mat-label>Full Name</mat-label>
      <input
        matInput
        [(ngModel)]="fullName"
        name="fullName"
        maxlength="255"
        autocomplete="name"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Add Role</mat-label>
      <mat-select
        [ngModel]="rolePickerId"
        (ngModelChange)="addRole($event)"
        name="rolePickerId"
        [disabled]="rolesLoading()"
      >
        @for (role of availableRoles(); track role.id) {
          <mat-option [value]="role.id">{{ role.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (selectedRoles().length > 0) {
      <mat-chip-set aria-label="Selected roles">
        @for (role of selectedRoles(); track role.id) {
          <mat-chip [removable]="true" (removed)="removeRole(role.id)">
            {{ role.name }}
            <button matChipRemove type="button" [attr.aria-label]="'Remove ' + role.name">
              <mat-icon>cancel</mat-icon>
            </button>
          </mat-chip>
        }
      </mat-chip-set>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button class="ff-btn-primary" (click)="save()" [disabled]="saving() || !isValid()">Save</button>
</mat-dialog-actions>
