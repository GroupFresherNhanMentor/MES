<div class="page-header">
  <h1 class="page-heading">Machines</h1>
  <p class="page-subtitle">Manage machine registry and operational status</p>
</div>
<mat-card>
  <mat-card-header>
    <mat-card-title>Machine Management</mat-card-title>
    <div class="toolbar">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="keyword" (keyup.enter)="search()" placeholder="code or name">
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filterStatus" (selectionChange)="search()">
          <mat-option value="">All</mat-option>
          @for (s of statuses; track s) {
            <mat-option [value]="s">{{ s }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="items()" class="full-width">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let m">{{ m.code }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let m">{{ m.name }}</td>
      </ng-container>
      <ng-container matColumnDef="line">
        <th mat-header-cell *matHeaderCellDef>Production Line</th>
        <td mat-cell *matCellDef="let m">{{ m.productionLineName }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let m">
          <span class="ff-badge" [class]="getStatusClass(m.machineStatusName)">
            {{ m.machineStatusName }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let m">
          <button mat-icon-button (click)="deactivate(m)" [disabled]="!isActive(m.machineStatusName)">
            <mat-icon>block</mat-icon>
          </button>
          <button mat-icon-button [matMenuTriggerFor]="statusMenu">
            <mat-icon>sync</mat-icon>
          </button>
          <mat-menu #statusMenu="matMenu">
            @for (s of statuses; track s) {
              <button mat-menu-item (click)="changeStatus(m, s)">
                <span [class.ff-badge--active]="s === 'RUNNING'"
                      [class.ff-badge--idle]="s === 'IDLE'"
                      [class.ff-badge--onhold]="s === 'MAINTENANCE'"
                      [class.ff-badge--cancelled]="s === 'BREAKDOWN' || s === 'INACTIVE'"
                      style="display:inline;padding:0;background:transparent;border:none;font-size:13px;">
                  {{ s }}
                </span>
              </button>
            }
          </mat-menu>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="total()" [pageSize]="size()" [pageIndex]="page()"
      (page)="onPage($event)" [pageSizeOptions]="[10,20,50]"></mat-paginator>
  </mat-card-content>
</mat-card>
