<div class="page-header">
  <h1 class="page-heading">Production Lines</h1>
  <p class="page-subtitle">Manage production lines and workflow routing</p>
</div>
<mat-card>
  <mat-card-header>
    <mat-card-title>Production Line Management</mat-card-title>
    <div class="toolbar">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="keyword" (keyup.enter)="search()" placeholder="code or name">
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filterStatus" (selectionChange)="search()">
          <mat-option value="">All</mat-option>
          @for (s of statuses; track s) {
            <mat-option [value]="s">{{ s }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="items()" class="full-width">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let pl">{{ pl.code }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let pl">{{ pl.name }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let pl">
          <span class="ff-badge"
            [class.ff-badge--active]="pl.lineStatusName === 'ACTIVE'"
            [class.ff-badge--cancelled]="pl.lineStatusName !== 'ACTIVE'">
            {{ pl.lineStatusName }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let pl">
          <button mat-icon-button (click)="deactivate(pl)" [disabled]="!isActive(pl.lineStatusName)">
            <mat-icon>block</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="total()" [pageSize]="size()" [pageIndex]="page()"
      (page)="onPage($event)" [pageSizeOptions]="[10,20,50]"></mat-paginator>
  </mat-card-content>
</mat-card>
