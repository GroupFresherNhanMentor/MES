<div class="page-container ff-fade-in">
  <mat-card>
    <mat-card-header class="!flex !items-center !justify-between !pb-4">
      <mat-card-title class="!text-xl !font-semibold !text-text-primary">Production Line Management</mat-card-title>

      <div class="toolbar flex items-center gap-3">
        <button mat-raised-button class="ff-btn-primary" (click)="openCreate()">
          <mat-icon>add</mat-icon> Add Line
        </button>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-64">
          <mat-label>Search</mat-label>
          <input matInput [(ngModel)]="keyword" (keyup.enter)="search()" placeholder="code or name">
          <mat-icon matSuffix class="text-text-muted">search</mat-icon>
        </mat-form-field>
      </div>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="items()" class="full-width">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let l" class="font-mono text-sm font-medium text-text-primary">{{ l.code }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let l" class="font-medium">{{ l.name }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let l">
            <span class="ff-badge"
              [class.ff-badge--active]="l.lineStatusName === 'ACTIVE'"
              [class.ff-badge--cancelled]="l.lineStatusName !== 'ACTIVE'">
              {{ l.lineStatusName || 'N/A' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th>
          <td mat-cell *matCellDef="let l" class="!text-right">
            <div class="flex items-center justify-end gap-1">
              <button mat-icon-button class="ff-action-btn-edit" (click)="openEdit(l)" matTooltip="Edit line">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="ff-action-btn-delete" (click)="deactivate(l)" matTooltip="Deactivate">
                <mat-icon>block</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      @if (items().length === 0) {
        <div class="flex flex-col items-center justify-center py-12 text-text-muted">
          <mat-icon class="!w-12 !h-12 !text-5xl mb-2 opacity-30">precision_manufacturing</mat-icon>
          <span class="text-sm">No production lines found</span>
        </div>
      }

      <mat-paginator [length]="total()" [pageSize]="size()" [pageIndex]="page()"
        (page)="onPage($event)" [pageSizeOptions]="[10, 20, 50]"></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
