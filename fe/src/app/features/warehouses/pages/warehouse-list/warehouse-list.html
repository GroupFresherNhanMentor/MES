<div class="page-header">
  <h1 class="page-heading">Warehouses</h1>
  <p class="page-subtitle">Manage warehouses and storage locations</p>
</div>
<mat-card>
  <mat-card-header>
    <mat-card-title>Warehouse Management</mat-card-title>
      <div class="toolbar">
        <button mat-raised-button color="primary" (click)="openCreate()" style="margin-right:8px;">
          <mat-icon>add</mat-icon> Add
        </button>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Search</mat-label>
          <input matInput [(ngModel)]="keyword" (keyup.enter)="search()" placeholder="code or name">
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="filterStatus" (selectionChange)="search()">
            <mat-option value="">All</mat-option>
            @for (s of statuses; track s) {
              <mat-option [value]="s">{{ s }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="items()" class="full-width">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let w">{{ w.code }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let w">{{ w.name }}</td>
      </ng-container>
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let w">{{ w.address }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let w">
          <span class="ff-badge"
            [class.ff-badge--active]="w.warehouseStatusName === 'ACTIVE'"
            [class.ff-badge--cancelled]="w.warehouseStatusName !== 'ACTIVE'">
            {{ w.warehouseStatusName }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let w">
            <button mat-icon-button (click)="openEdit(w)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="deactivate(w)" [disabled]="!isActive(w.warehouseStatusName)">
              <mat-icon>block</mat-icon>
            </button>
          </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="total()" [pageSize]="size()" [pageIndex]="page()"
      (page)="onPage($event)" [pageSizeOptions]="[10,20,50]"></mat-paginator>
  </mat-card-content>
</mat-card>
