<div class="flex flex-col h-screen bg-surface-app">
  @if (isLoading()) { <mat-progress-bar mode="indeterminate" class="!fixed !top-0 !inset-x-0 !z-[9999]" /> }

  <mat-toolbar class="!flex !items-center !gap-4 !px-4 !h-14 !bg-surface-elevated !border-b !border-border-default !sticky !top-0 !z-[100]">
    <button mat-icon-button (click)="toggleSidenav()" class="!w-9 !h-9 !flex !items-center !justify-center">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="font-bold text-base text-primary tracking-wide min-w-[60px]">MES</span>
    <span class="flex-1"></span>
    <span class="text-sm text-text-primary font-medium">{{ pageTitle() }}</span>
    <span class="flex-1"></span>
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="!w-9 !h-9 !flex !items-center !justify-center">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="px-4 py-3">
        <div class="text-sm font-semibold text-text-primary">{{ currentUser?.fullName ?? 'User' }}</div>
        <div class="text-[11px] text-text-secondary uppercase tracking-wider">{{ currentUser?.role }}</div>
      </div>
      <mat-divider />
      <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Logout</button>
    </mat-menu>
  </mat-toolbar>

  <mat-drawer-container class="!flex-1 !bg-transparent" autosize>
    <mat-drawer #drawer [opened]="sidenavOpened()" [mode]="isMobile() ? 'over' : 'side'" class="!w-[220px] !bg-surface-elevated !border-r !border-border-light overflow-y-auto">
      <nav class="flex flex-col gap-0.5 p-2">
        @for (item of filteredNavItems; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeSidenavOnMobile()" class="nav-item">
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>
    </mat-drawer>

    <mat-drawer-content class="!bg-surface-app overflow-y-auto">
      <div class="p-6 max-w-[1440px] mx-auto">
        <router-outlet />
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
