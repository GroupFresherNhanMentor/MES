<div style="display:flex; flex-direction:column; height:100vh; background:#0c0a09;">
  @if (isLoading()) { <mat-progress-bar mode="indeterminate" style="position:fixed; top:0; left:0; right:0; z-index:9999;" /> }

  <mat-toolbar style="display:flex; align-items:center; gap:16px; padding:0 16px; height:56px; background:#1c1917; border-bottom:1px solid #44403c; position:sticky; top:0; z-index:100;">
    <button mat-icon-button (click)="toggleSidenav()" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center;">
      <mat-icon>menu</mat-icon>
    </button>
    <span style="font-weight:700; font-size:16px; color:#ea580c; letter-spacing:1px; min-width:60px;">MES</span>
    <span style="flex:1;"></span>
    <span style="font-size:14px; color:#fafaf9; font-weight:500;">{{ pageTitle() }}</span>
    <span style="flex:1;"></span>
    <button mat-icon-button [matMenuTriggerFor]="userMenu" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center;">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div style="padding:12px 16px;">
        <div style="font-size:14px; font-weight:600; color:#fafaf9;">{{ currentUser?.fullName ?? 'User' }}</div>
        <div style="font-size:11px; color:#a8a29e; text-transform:uppercase; letter-spacing:0.5px;">{{ currentUser?.role }}</div>
      </div>
      <mat-divider />
      <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Logout</button>
    </mat-menu>
  </mat-toolbar>

  <mat-drawer-container style="flex:1; background:transparent;" autosize>
    <mat-drawer #drawer [opened]="sidenavOpened()" mode="side" style="width:220px; background:#1c1917; border-right:1px solid #292524; overflow-y:auto;">
      <nav style="display:flex; flex-direction:column; gap:2px; padding:8px;">
        @for (item of filteredNavItems; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="router-active"
            style="display:flex; align-items:center; gap:12px; padding:0 12px; height:38px; border-radius:6px; color:#fafaf9; font-size:14px; font-weight:500; text-decoration:none; cursor:pointer; transition:all 0.1s;">
            <mat-icon style="font-size:20px; width:20px; height:20px;">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </mat-drawer>

    <mat-drawer-content style="background:#0c0a09; overflow-y:auto;">
      <div style="padding:24px; max-width:1440px; margin:0 auto;">
        <router-outlet />
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
