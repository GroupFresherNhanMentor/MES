<div class="shell">
  @if (isLoading()) { <mat-progress-bar mode="indeterminate" class="loader" /> }
  <mat-toolbar class="toolbar">
    <button mat-icon-button (click)="toggleSidenav()"><mat-icon>menu</mat-icon></button>
    <span class="brand">MES</span>
    <span class="spacer"></span>
    <span class="title">{{ pageTitle() }}</span>
    <span class="spacer"></span>
    <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>account_circle</mat-icon></button>
    <mat-menu #menu="matMenu">
      <div class="user-info"><strong>{{ currentUser?.fullName }}</strong><span>{{ currentUser?.role }}</span></div>
      <mat-divider />
      <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Logout</button>
    </mat-menu>
  </mat-toolbar>
  <mat-drawer-container class="container" autosize>
    <mat-drawer [opened]="sidenavOpened()" mode="side" class="sidenav">
      <nav> @for (item of filteredNavItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.path==='/dashboard'}" class="nav-item">
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label }}</span>
        </a> }
      </nav>
    </mat-drawer>
    <mat-drawer-content class="content">
      <div class="page"><router-outlet /></div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
