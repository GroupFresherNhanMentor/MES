services:
  postgres:
    image: postgres:18-alpine
    container_name: db
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
